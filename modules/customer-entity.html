<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户主体管理 - 资产中台</title>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@6.5.95/css/materialdesignicons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1890ff;
            --success-color: #52c41a;
            --warning-color: #faad14;
            --error-color: #f5222d;
            --text-color: #333;
            --border-color: #e8e8e8;
            --bg-color: #f0f2f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-color);
            background: var(--bg-color);
        }

        .filters {
            background: white;
            padding: 24px;
            border-radius: 4px;
            margin-bottom: 24px;
            box-shadow: 0 1px 4px rgba(0,21,41,.08);
        }

        .filter-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .filter-item {
            flex: 1;
        }

        .filter-item label {
            display: block;
            margin-bottom: 8px;
            color: #666;
        }

        .filter-item input,
        .filter-item select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        .filter-item input:focus,
        .filter-item select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .filter-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-default {
            background: white;
            border: 1px solid var(--border-color);
        }

        .btn:hover {
            opacity: 0.8;
        }

        .table-container {
            background: white;
            padding: 24px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,21,41,.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: #fafafa;
            font-weight: 500;
        }

        .status-tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 12px;
        }

        .status-active {
            background: #f6ffed;
            color: var(--success-color);
        }

        .status-inactive {
            background: #fff1f0;
            color: var(--error-color);
        }

        .action-btn {
            color: var(--primary-color);
            background: none;
            border: none;
            cursor: pointer;
            margin-right: 8px;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 24px;
            border-radius: 4px;
            width: 500px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 引入共享导航 -->
    <div id="nav-container"></div>

    <script>
        // 加载共享导航
        const xhr = new XMLHttpRequest();
        xhr.open('GET', '../shared/nav.html', true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                document.getElementById('nav-container').innerHTML = xhr.responseText;
                // 设置页面标题
                document.getElementById('page-title').textContent = '客户主体管理';
                
                // 将页面内容移动到content区域
                const content = document.querySelector('.content');
                const filters = document.querySelector('.filters');
                const tableContainer = document.querySelector('.table-container');
                const modals = document.querySelectorAll('.modal');
                
                if (filters) content.appendChild(filters);
                if (tableContainer) content.appendChild(tableContainer);
                modals.forEach(modal => content.appendChild(modal));
            }
        };
        xhr.send();
    </script>

    <div class="filters">
        <div class="filter-row">
            <div class="filter-item">
                <label>主体ID</label>
                <input type="text" placeholder="请输入主体ID">
            </div>
            <div class="filter-item">
                <label>主体名称</label>
                <input type="text" placeholder="请输入主体名称">
            </div>
            <div class="filter-item">
                <label>合同编号</label>
                <input type="text" placeholder="请输入合同编号">
            </div>
        </div>
        <div class="filter-row">
            <div class="filter-item">
                <label>客户经理</label>
                <select>
                    <option value="">全部</option>
                    <option value="1">张三</option>
                    <option value="2">李四</option>
                </select>
            </div>
            <div class="filter-item">
                <label>状态</label>
                <select multiple>
                    <option value="active" selected>正常</option>
                    <option value="inactive">禁用</option>
                </select>
            </div>
            <div class="filter-item">
                <label>创建时间</label>
                <input type="date">
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn btn-default">重置</button>
            <button class="btn btn-primary">查询</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>主体ID</th>
                    <th>主体名称</th>
                    <th>合同编号</th>
                    <th>客户经理</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>SUB001</td>
                    <td>测试公司A</td>
                    <td>HT20240320001</td>
                    <td>张三</td>
                    <td><span class="status-tag status-active">正常</span></td>
                    <td>2024-03-20</td>
                    <td>
                        <button class="action-btn">编辑</button>
                        <button class="action-btn">查看钱包</button>
                    </td>
                </tr>
                <tr>
                    <td>SUB002</td>
                    <td>测试公司B</td>
                    <td>HT20240320002</td>
                    <td>李四</td>
                    <td><span class="status-tag status-inactive">禁用</span></td>
                    <td>2024-03-19</td>
                    <td>
                        <button class="action-btn">编辑</button>
                        <button class="action-btn">查看钱包</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑主体信息</h3>
                <button class="close">&times;</button>
            </div>
            <form>
                <div class="form-group">
                    <label>主体名称</label>
                    <input type="text" placeholder="请输入主体名称">
                </div>
                <div class="form-group">
                    <label>客户经理</label>
                    <select>
                        <option value="1">张三</option>
                        <option value="2">李四</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>状态</label>
                    <select>
                        <option value="active">正常</option>
                        <option value="inactive">禁用</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button type="button" class="btn btn-default">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 简单的交互逻辑
        document.querySelectorAll('.action-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.textContent === '编辑') {
                    document.getElementById('editModal').style.display = 'block';
                }
            });
        });

        document.querySelector('.close').addEventListener('click', () => {
            document.getElementById('editModal').style.display = 'none';
        });

        document.querySelector('.btn-default').addEventListener('click', () => {
            document.getElementById('editModal').style.display = 'none';
        });
    </script>
</body>
</html>
