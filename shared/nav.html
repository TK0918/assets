<!-- 共享导航栏 -->
<style>
    :root {
        --primary-color: #1890ff;
        --text-color: #333;
        --border-color: #e8e8e8;
        --bg-color: #f0f2f5;
        --sidebar-width: 240px;
    }

    .layout {
        display: flex;
        min-height: 100vh;
    }

    .sidebar {
        width: var(--sidebar-width);
        background: #001529;
        color: white;
        padding: 20px 0;
        position: fixed;
        height: 100vh;
        overflow-y: auto;
    }

    .logo {
        padding: 0 24px;
        height: 64px;
        display: flex;
        align-items: center;
        font-size: 20px;
        font-weight: bold;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        margin-bottom: 16px;
    }

    .menu {
        list-style: none;
    }

    .menu-item {
        padding: 12px 24px;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: white;
    }

    .menu-item:hover {
        background: rgba(255,255,255,0.1);
    }

    .menu-item.active {
        background: var(--primary-color);
    }

    .main-content {
        margin-left: var(--sidebar-width);
        flex: 1;
        padding: 24px;
    }

    .header {
        background: white;
        padding: 16px 24px;
        box-shadow: 0 1px 4px rgba(0,21,41,.08);
        margin-bottom: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .user-info {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #ccc;
    }
</style>

<div class="layout">
    <aside class="sidebar">
        <div class="logo">
            资产中台
        </div>
        <ul class="menu">
            <li>
                <a href="../modules/customer-entity.html" class="menu-item" id="nav-customer">
                    <i class="mdi mdi-account-group"></i>
                    客户主体管理
                </a>
            </li>
            <li>
                <a href="../modules/transfer-review.html" class="menu-item" id="nav-transfer">
                    <i class="mdi mdi-cash-multiple"></i>
                    线下转账审核
                </a>
            </li>
            <li>
                <a href="../modules/credit-review.html" class="menu-item" id="nav-credit">
                    <i class="mdi mdi-credit-card"></i>
                    信用额度审核
                </a>
            </li>
            <li>
                <a href="../modules/transaction-details.html" class="menu-item" id="nav-transaction">
                    <i class="mdi mdi-cash"></i>
                    资金明细
                </a>
            </li>
            <li>
                <a href="../modules/permission-config.html" class="menu-item" id="nav-permission">
                    <i class="mdi mdi-shield-account"></i>
                    权限配置
                </a>
            </li>
        </ul>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1 id="page-title">页面标题</h1>
            <div class="user-info">
                <span>管理员</span>
                <div class="avatar"></div>
            </div>
        </header>
        <div class="content">
            <!-- 页面内容将在这里 -->
        </div>
    </main>
</div>

<script>
    // 根据当前页面设置活动菜单项
    const currentPage = window.location.pathname.split('/').pop();
    const navMap = {
        'customer-entity.html': 'nav-customer',
        'transfer-review.html': 'nav-transfer',
        'credit-review.html': 'nav-credit',
        'transaction-details.html': 'nav-transaction',
        'permission-config.html': 'nav-permission'
    };
    
    const activeNavId = navMap[currentPage];
    if (activeNavId) {
        document.getElementById(activeNavId).classList.add('active');
    }
</script>
